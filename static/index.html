<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f5f7"><title>Cat-Meet</title>
<link rel="stylesheet" href="/common.css?v=1.2.2-cat.3">
<link rel="stylesheet" href="/mainpage.css?v=1.2.2-cat.3">
<link rel="stylesheet" href="/cat-meet-v2.css?v=1.2.2-cat.3">
<link rel="stylesheet" href="/cat-meet-home-compact.css?v=1.2.2-cat.3">
<link rel="stylesheet" href="/cat-meet-pro.css?v=1.2.2-cat.5">
</head>
<body class="cm-v2-home cm-home-compact">
<main class="cm-compact-shell">
<header class="cm-compact-header"><a class="cm-home-brand" href="/" aria-label="Cat-Meet"><span class="cm-logo">CM</span><span><strong>Cat-Meet</strong><small>VIDEO COLLABORATION</small></span></a><label for="language-select">语言 / Language</label><select id="language-select"><option value="zh-CN">简体中文</option><option value="en">English</option></select></header>
<section class="cm-compact-card">
<div class="cm-compact-mark" aria-hidden="true">CM</div>
<p class="cm-overline">CAT-MEET · SECURE MEETING</p>
<h1>加入会议</h1>
<p class="cm-compact-desc">输入会议室名称，验证账号后即可加入。</p>
<form id="groupform" class="cm-compact-form">
<label for="group">会议室名称</label>
<div class="cm-compact-input"><input id="group" name="group" type="text" maxlength="128" required autocomplete="off" spellcheck="false" placeholder="请输入会议室名称"><button id="submitbutton" type="submit">继续 <span aria-hidden="true">→</span></button></div>
<p id="errormessage" role="alert" aria-live="polite"></p>
</form>
<p class="cm-compact-security"><span>●</span> 会议加入前需要验证账号和密码</p>
</section>
<footer>Cat-Meet · 浏览器直接参会，无需安装客户端</footer>
</main>
<script src="/mainpage.js?v=1.2.2-cat.4" defer></script>
<script src="/i18n.js?v=1.2.2-cat.4" defer></script>
</body></html>
