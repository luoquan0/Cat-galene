name: Cat-Meet Linux Server CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Go server and browser frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true

      - name: Test source and frontend
        run: |
          go mod verify
          go test ./...
          go build -trimpath -o /tmp/cat-meet .
          go build -trimpath -o /tmp/cat-meetctl ./galenectl
          test -s static/cat-meet-v2.css
          test -s static/admin.css
          test -s static/cat-meet-home-compact.css
          test -s static/chaofan.png
          test -s static/cat-meet-v2.css
          test -s static/cat-meet-home-compact.css
          node --check static/admin.js
          node --check static/galene.js
          node --check static/cat-meet-v2.js
          node --check static/mainpage.js
          node --check static/galene.js
          node --check static/camera-test.js
          node --check static/mainpage.js
          node --check static/cat-meet-v2.js
          node --check static/galene.js
          node --check static/protocol.js
          node --check static/share-zoom.js
          node --check static/i18n.js
          node --check static/camera-test.js
          node --check static/third-party/contextual/contextual.js
          node --test tests/frontend.test.cjs

      - name: Scan known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -mode=source ./...

  release:
    name: Package Linux server
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release:v1.2.2-cat.9]'))
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true

      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          else
            echo "RELEASE_TAG=v1.2.2-cat.9" >> "${GITHUB_ENV}"
          fi

      - name: Build Linux server packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            package="Cat-Meet_${RELEASE_TAG}_linux_server_${arch}"
            root="${RUNNER_TEMP}/${package}"
            mkdir -p "${root}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" -o "${root}/cat-meet" .
            ln -s cat-meet "${root}/galene"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" -o "${root}/cat-meetctl" ./galenectl
            ln -s cat-meetctl "${root}/galenectl"
            cp -R static "${root}/static"
            cp README.md LICENCE galene.md galene-install.md \
              galene-client.md galene-protocol.md galene-api.md "${root}/"
            tar -czf "dist/${package}.tar.gz" -C "${RUNNER_TEMP}" "${package}"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)

      - name: Publish Linux release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; will not overwrite artifacts."
            exit 0
          fi
          cat > "${RUNNER_TEMP}/notes.txt" <<'EOF'
          Cat-Meet v1.2.2-cat.9 · cute responsive UI + chat attachments.

          - Keeps the microphone auto-recovery and device reliability fixes from v1.2.2-cat.4.
          - Display account/password login immediately on room navigation; wait for room metadata before submit.
          - Fix unreadable participant menus and native dropdown option contrast.
          - Simplified desktop homepage: one meeting-name input and join action.
          - Room entry always displays username/password verification; invite tokens do not auto-join.
          - Improved mobile camera selection, device refresh, capture fallback and track recovery.
          - Secure browser admin console for room, user, permission, and password management.
          - Interactive ./cat-meetctl bootstrap-admin creates private bcrypt-hashed credentials.
          - Same-origin admin checks, stricter admin CSP, URL validation and safer redirects.
          - Reworked the browser homepage, pre-join lobby, and live meeting UI with a flatter professional visual system.
          - Independent camera and microphone controls, including camera-only joins.
          - Includes upstream moderator-permission fixes, subgroup improvements,
            Firefox camera-test compatibility, and dependency updates.
          - Retains independent microphone/camera controls, Chinese/English
            interface, adjustable high-resolution screen share, and viewer zoom.
          - Participants join from their browsers; Windows desktop client is retired.
          - Added dedicated responsive desktop/tablet/mobile layout rules and bumped frontend asset cache versions.
          - Added the chaofan.png Cat Studio branding to homepage, meeting UI, and favicon.
          - Added paste-to-send image support plus chat file attachments for all current participants.
          - Added in-chat download cards and image previews for received files.
          - Reworked the visual language toward a warm, rounded, kawaii Cat-Meet style.
          - Fixed the logo URL by packaging chaofan.png inside static/.
          - Moved chat into a left-side slide-in drawer with close button, backdrop and Escape handling.
          - Kept the video and screen-share stage full-width and centered; the participant drawer overlays instead of shrinking it.
          - Linux amd64/arm64 server packages and SHA256 checksums.

          See CHANGES and README for details.
          EOF
          gh release create "${RELEASE_TAG}" dist/*.tar.gz \
            dist/SHA256SUMS.txt --target "${GITHUB_SHA}" \
            --title "Cat-Meet ${RELEASE_TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.txt"
