name: Cross-platform Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-smoke:
    name: Windows native build and tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up patched Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true

      - name: Run Windows tests
        run: go test ./...

      - name: Verify Windows executables
        shell: pwsh
        run: |
          go build -trimpath -o galene.exe .
          go build -trimpath -o galenectl.exe ./galenectl
          ./galene.exe -help
          ./galenectl.exe -help

  release:
    name: Test and package Linux + Windows
    needs: windows-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up patched Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true

      - name: Test source and frontend
        run: |
          go mod verify
          go test ./...
          node --check static/galene.js
          node --check static/camera-test.js
          node --check static/third-party/contextual/contextual.js
          node --test tests/frontend.test.cjs

      - name: Scan known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -mode=source ./...

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          else
            echo "RELEASE_TAG=v1.2.1-cat.2" >> "${GITHUB_ENV}"
          fi

      - name: Build portable packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux:amd64 linux:arm64 windows:amd64 windows:arm64; do
            IFS=: read -r os arch <<< "${target}"
            package="Cat-galene_${RELEASE_TAG}_${os}_${arch}"
            root="${RUNNER_TEMP}/${package}"
            mkdir -p "${root}"
            suffix=""
            if [[ "${os}" == "windows" ]]; then
              suffix=".exe"
            fi
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" -o "${root}/galene${suffix}" .
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" -o "${root}/galenectl${suffix}" ./galenectl
            cp -R static "${root}/static"
            cp README.md LICENCE galene.md galene-install.md \
              galene-client.md galene-protocol.md galene-api.md "${root}/"
            if [[ "${os}" == "windows" ]]; then
              cp start-windows.cmd README-WINDOWS.txt "${root}/"
              sed -i 's/\r$//; s/$/\r/' "${root}/start-windows.cmd"
              (cd "${RUNNER_TEMP}" && zip -qr \
                "${GITHUB_WORKSPACE}/dist/${package}.zip" "${package}")
            else
              tar -czf "dist/${package}.tar.gz" -C "${RUNNER_TEMP}" "${package}"
            fi
          done
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)

      - name: Publish new release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; will not overwrite artifacts."
            exit 0
          fi
          cat > "${RUNNER_TEMP}/notes.txt" <<'EOF'
          Cat-galene security and device-startup update (upstream Galene 1.2.1).

          Security:
          - Escaped participant names in context menus and recording-page HTML.
          - Added CSRF protection to recording deletion, strict Origin checks to
            administrative API mutations, and stricter response security headers.
          - Upgraded to patched Go 1.27.2 and refreshed vulnerable Go dependencies.

          Conference:
          - No automatic microphone request solely to enable Safari autoplay.
          - Joining with camera and microphone disabled no longer captures an
            empty stream or raises a device error.
          - Camera-test works with audio-only, video-only, or no device selected.
          - Retains screen-share video/text modes and independent bitrate cap.

          Portable assets:
          - Linux amd64 and arm64 tar.gz packages.
          - Windows amd64 and arm64 ZIP archives with galene.exe, galenectl.exe,
            static assets and start-windows.cmd.
          - SHA256SUMS.txt for file integrity verification.

          Note: In Safari, autoplay of received audio/video may require the user
          to press the playback button after joining.
          EOF
          gh release create "${RELEASE_TAG}" dist/*.tar.gz dist/*.zip \
            dist/SHA256SUMS.txt --target "${GITHUB_SHA}" \
            --title "Cat-galene ${RELEASE_TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.txt"