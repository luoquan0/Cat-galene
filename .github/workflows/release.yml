name: Cat-Meet Linux Server CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Go server and browser frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true

      - name: Test source and frontend
        run: |
          go mod verify
          go test ./...
          go build -trimpath -o /tmp/cat-meet .
          go build -trimpath -o /tmp/cat-meetctl ./galenectl
          node --check static/galene.js
          node --check static/protocol.js
          node --check static/share-zoom.js
          node --check static/i18n.js
          node --check static/camera-test.js
          node --check static/third-party/contextual/contextual.js
          node --test tests/frontend.test.cjs

      - name: Scan known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -mode=source ./...

  release:
    name: Package Linux server
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true

      - name: Build Linux server packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            package="Cat-Meet_${GITHUB_REF_NAME}_linux_server_${arch}"
            root="${RUNNER_TEMP}/${package}"
            mkdir -p "${root}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" -o "${root}/cat-meet" .
            ln -s cat-meet "${root}/galene"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" -o "${root}/cat-meetctl" ./galenectl
            ln -s cat-meetctl "${root}/galenectl"
            cp -R static "${root}/static"
            cp README.md LICENCE galene.md galene-install.md \
              galene-client.md galene-protocol.md galene-api.md "${root}/"
            tar -czf "dist/${package}.tar.gz" -C "${RUNNER_TEMP}" "${package}"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)

      - name: Publish Linux release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; will not overwrite artifacts."
            exit 0
          fi
          cat > "${RUNNER_TEMP}/notes.txt" <<'EOF'
          Cat-Meet Linux server based on Galène 1.2.2.

          - Includes upstream moderator-permission fixes, subgroup improvements,
            Firefox camera-test compatibility, and dependency updates.
          - Retains independent microphone/camera controls, Chinese/English
            interface, adjustable high-resolution screen share, and viewer zoom.
          - Participants join from their browsers; no Windows client is built.
          - Linux amd64/arm64 server packages and SHA256 checksums.

          See CHANGES and README for details.
          EOF
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
            dist/SHA256SUMS.txt --target "${GITHUB_SHA}" \
            --title "Cat-Meet ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.txt"
